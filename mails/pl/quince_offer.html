<!doctype html>
<html>
<head><meta charset="utf-8"><title>{shop_name}</title></head>
<body style="margin:0;padding:24px;background:#f6f6f6;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;padding:24px">
    <tr><td>
      <h1 style="margin:0 0 4px;font-size:20px">{shop_name}</h1>
      <p style="margin:0 0 20px;color:#65635d;font-size:13px">{offer_number}</p>

      <p style="margin:0 0 16px">{message}</p>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;border-top:1px solid #e2e1df;border-bottom:1px solid #e2e1df">
        {items}
      </table>

      <p style="margin:16px 0 0;font-size:13px;color:#65635d">Ważna do: {valid_until}</p>
      <p style="margin:24px 0 0;font-size:13px"><a href="{shop_url}" style="color:#1a1a1a">{shop_url}</a></p>
    </td></tr>
  </table>
</body>
</html>
